<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="ESP Box Assistant architecture: the box talks to a Supabase Edge Function that calls the chosen AI providers, a setup page manages everything, and GitHub Actions ships over-the-air updates.">
<style>.s{font-family:'Inter','SF Pro Display',-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.m{font-family:'JetBrains Mono','SF Mono',ui-monospace,Menlo,Consolas,monospace}.f{stroke-dasharray:4 8;animation:f 1.4s linear infinite}@keyframes f{to{stroke-dashoffset:-24}}.p{animation:p 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes p{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:0;transform:scale(2.6)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style>
<defs><linearGradient id="a" x1="0" x2="1"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#22D3EE"/></linearGradient></defs>
<rect x=".5" y=".5" width="1199" height="519" rx="18" fill="#0A0A0C" stroke="#2A2A32"/>
<rect x="40" y="70" width="280" height="160" rx="14" fill="#111115" stroke="#2A2A32"/><text x="60" y="100" class="m" font-size="12" letter-spacing="1.2" fill="#71717A">FIRMWARE · C / ESP-IDF</text><text x="60" y="126" class="s" font-size="21" font-weight="700" fill="#F4F4F5">ESP32-S3-BOX-3</text><text x="60" y="156" class="s" font-size="15.5" fill="#A1A1AA">Tap to talk, touchscreen UI</text><text x="60" y="179" class="s" font-size="15.5" fill="#A1A1AA">Wi-Fi manager, hotspot setup</text><text x="60" y="202" class="s" font-size="15.5" fill="#A1A1AA">OTA with automatic rollback</text>
<rect x="40" y="300" width="280" height="160" rx="14" fill="#111115" stroke="#2A2A32"/><text x="60" y="330" class="m" font-size="12" letter-spacing="1.2" fill="#71717A">CI / CD</text><text x="60" y="356" class="s" font-size="21" font-weight="700" fill="#F4F4F5">GitHub Actions</text><text x="60" y="386" class="s" font-size="15.5" fill="#A1A1AA">Builds on every push to main</text><text x="60" y="409" class="s" font-size="15.5" fill="#A1A1AA">OIDC identity, no stored secrets</text><text x="60" y="432" class="s" font-size="15.5" fill="#A1A1AA">Publishes over-the-air builds</text>
<rect x="430" y="110" width="340" height="300" rx="16" fill="#111115" stroke="url(#a)" stroke-width="1.6"/>
<text x="454" y="144" class="m" font-size="12" letter-spacing="1.2" fill="#71717A">SUPABASE EDGE FUNCTION</text>
<text x="454" y="174" class="s" font-size="22" font-weight="700" fill="#F4F4F5">Cloud brain</text>
<circle cx="464" cy="209" r="11" fill="#0A0A0C" stroke="#2A2A32"/>
<text x="464" y="213" text-anchor="middle" class="m" font-size="11" fill="#22D3EE">1</text>
<text x="486" y="214" class="s" font-size="17" fill="#A1A1AA">Check-in: config, Wi-Fi, updates</text>
<circle cx="464" cy="247" r="11" fill="#0A0A0C" stroke="#2A2A32"/>
<text x="464" y="251" text-anchor="middle" class="m" font-size="11" fill="#22D3EE">2</text>
<text x="486" y="252" class="s" font-size="17" fill="#A1A1AA">Speech to text</text>
<circle cx="464" cy="285" r="11" fill="#0A0A0C" stroke="#2A2A32"/>
<text x="464" y="289" text-anchor="middle" class="m" font-size="11" fill="#22D3EE">3</text>
<text x="486" y="290" class="s" font-size="17" fill="#A1A1AA">Ask the chosen model</text>
<circle cx="464" cy="323" r="11" fill="#0A0A0C" stroke="#2A2A32"/>
<text x="464" y="327" text-anchor="middle" class="m" font-size="11" fill="#22D3EE">4</text>
<text x="486" y="328" class="s" font-size="17" fill="#A1A1AA">Text to speech, streamed</text>
<circle cx="464" cy="361" r="11" fill="#0A0A0C" stroke="#2A2A32"/>
<text x="464" y="365" text-anchor="middle" class="m" font-size="11" fill="#22D3EE">5</text>
<text x="486" y="366" class="s" font-size="17" fill="#A1A1AA">Draw Hindi text as a bitmap</text>
<rect x="880" y="70" width="280" height="160" rx="14" fill="#111115" stroke="#2A2A32"/><text x="900" y="100" class="m" font-size="12" letter-spacing="1.2" fill="#71717A">STT · CHAT · TTS</text><text x="900" y="126" class="s" font-size="21" font-weight="700" fill="#F4F4F5">AI providers</text><text x="900" y="156" class="s" font-size="15.5" fill="#A1A1AA">OpenAI, Anthropic, Gemini</text><text x="900" y="179" class="s" font-size="15.5" fill="#A1A1AA">Groq, OpenRouter</text><text x="900" y="202" class="s" font-size="15.5" fill="#A1A1AA">ElevenLabs, Sarvam AI</text>
<rect x="880" y="300" width="280" height="160" rx="14" fill="#111115" stroke="#2A2A32"/><text x="900" y="330" class="m" font-size="12" letter-spacing="1.2" fill="#71717A">WEB · ADMIN</text><text x="900" y="356" class="s" font-size="21" font-weight="700" fill="#F4F4F5">Setup page</text><text x="900" y="386" class="s" font-size="15.5" fill="#A1A1AA">Provider, keys, language</text><text x="900" y="409" class="s" font-size="15.5" fill="#A1A1AA">Wi-Fi list, pairing</text><text x="900" y="432" class="s" font-size="15.5" fill="#A1A1AA">Firmware updates per box</text>
<path d="M320,150 L430,190" stroke="#2A2A32" stroke-width="1.5" fill="none"/><path class="f" d="M320,150 L430,190" stroke="url(#a)" stroke-width="1.6" fill="none"/><circle r="3.2" fill="#22D3EE"><animateMotion dur="1.6s" repeatCount="indefinite" path="M320,150 L430,190"/></circle><circle r="3.2" fill="#7C5CFF"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M430,190 L320,150"/></circle><text x="375" y="156" text-anchor="middle" class="m" font-size="13" fill="#71717A">HTTPS</text>
<path d="M320,380 L430,330" stroke="#2A2A32" stroke-width="1.5" fill="none"/><path class="f" d="M320,380 L430,330" stroke="url(#a)" stroke-width="1.6" fill="none"/><circle r="3.2" fill="#22D3EE"><animateMotion dur="1.9s" repeatCount="indefinite" path="M320,380 L430,330"/></circle><text x="368" y="372" text-anchor="middle" class="m" font-size="13" fill="#71717A">OIDC</text>
<path d="M770,190 L880,150" stroke="#2A2A32" stroke-width="1.5" fill="none"/><path class="f" d="M770,190 L880,150" stroke="url(#a)" stroke-width="1.6" fill="none"/><circle r="3.2" fill="#22D3EE"><animateMotion dur="1.7s" repeatCount="indefinite" path="M770,190 L880,150"/></circle><circle r="3.2" fill="#7C5CFF"><animateMotion dur="1.7s" begin="0.85s" repeatCount="indefinite" path="M880,150 L770,190"/></circle><text x="825" y="156" text-anchor="middle" class="m" font-size="13" fill="#71717A">API calls</text>
<path d="M880,380 L770,330" stroke="#2A2A32" stroke-width="1.5" fill="none"/><path class="f" d="M880,380 L770,330" stroke="url(#a)" stroke-width="1.6" fill="none"/><circle r="3.2" fill="#22D3EE"><animateMotion dur="2.1s" repeatCount="indefinite" path="M880,380 L770,330"/></circle><circle r="3.2" fill="#7C5CFF"><animateMotion dur="2.1s" begin="1.05s" repeatCount="indefinite" path="M770,330 L880,380"/></circle><text x="830" y="372" text-anchor="middle" class="m" font-size="13" fill="#71717A">admin</text>
<circle class="p" cx="740" cy="140" r="4.5" fill="#22C55E"/><circle cx="740" cy="140" r="4.5" fill="#22C55E"/>
<text x="40" y="44" class="m" font-size="12" letter-spacing="1.5" fill="#A1A1AA">HOW IT WORKS</text>
<text x="600" y="490" text-anchor="middle" class="s" font-size="16" fill="#71717A">API keys live in Supabase Vault. The box never sees them, and never needs a laptop after the first flash.</text>
</svg>
